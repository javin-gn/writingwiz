{% extends "base.html" %}

{% block title %}
	<title>A&#42; Composition - Browse</title>
{% endblock %}

{% block statics %}

<script type="text/javascript" charset="utf-8">

function loadQuestions(el, query, ty){
	$('.category-link').removeClass('active');
	if (el) { $(el).addClass('active'); }
	$( "#questions").load('/questions/?type=' + encodeURIComponent(ty) + '&query=' + encodeURIComponent(query));
}

</script>
{% endblock %}

{% block contents %}	
    <div class="container">
		<div class="page-header" id="banner">
		<div class="row">
	           <div class="col-lg-4">
				 <p class="sidebar-heading">Categories</p>
	             {{list|safe}}
	           </div>
	           <div class="col-lg-8" style="padding: 15px 15px 0 15px;">
	             {{content|safe}}
	           </div>
	     </div>
	</div>
	          
		 		
	   

{% endblock %}
